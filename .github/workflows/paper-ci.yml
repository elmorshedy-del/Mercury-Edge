name: Paper Trader CI

on:
  pull_request:
  push:
    branches:
      - paper-trader-v1
      - paper-rigour-v2

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run check

  collector-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper_collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: paper_collector/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile collector.py weather_collector.py omo_collector.py rule_collector.py paper_engine.py paper_engine_hardened.py strategy_engines.py strategy_runtime.py strategy_runtime_hardened.py unified_engine.py status_reporter.py audit_replay.py audit_daemon.py runner.py stations.py asos_evidence.py market_calendar.py hard_state_proof.py hard_information_domain.py hard_state_accumulator.py hard_state_journal.py bucket_elimination.py dead_no_execution.py dead_no_executor.py madis_omo.py madis_temperature_mapping.py raw_journal.py test_strategy_engines.py test_asos_evidence.py test_market_calendar.py test_hard_state_proof.py test_hard_state_integration.py test_hard_information_domain.py test_hard_state_accumulator.py test_hard_state_accumulator_integration.py test_bucket_elimination.py test_dead_no_execution.py test_dead_no_executor.py test_madis_omo.py test_madis_temperature_mapping.py test_raw_journal.py test_weather_collector_capture.py test_evidence_versioning.py test_live_asos_channels.py
      - run: python -m unittest -v test_strategy_engines.py test_asos_evidence.py test_market_calendar.py test_hard_state_proof.py test_hard_state_integration.py test_hard_information_domain.py test_hard_state_accumulator.py test_hard_state_accumulator_integration.py test_bucket_elimination.py test_dead_no_execution.py test_dead_no_executor.py test_madis_omo.py test_madis_temperature_mapping.py test_raw_journal.py test_weather_collector_capture.py test_evidence_versioning.py test_live_asos_channels.py
      - run: python -c "import websockets, cryptography, psycopg; print(websockets.__version__, cryptography.__version__, psycopg.__version__)"
      - run: docker build -t mercury-paper-collector .

  migration-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mercury
          POSTGRES_PASSWORD: mercury
          POSTGRES_DB: mercury_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercury -d mercury_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mercury:mercury@localhost:5432/mercury_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: ./node_modules/.bin/tsx scripts/migrate.ts
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/tests/013_immutable_hard_information_journal_test.sql
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f sql/tests/016_hard_state_timeline_test.sql
