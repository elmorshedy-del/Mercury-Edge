name: Paper Trader CI

on:
  pull_request:
  push:
    branches:
      - paper-trader-v1

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run check

  collector-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper_collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: paper_collector/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile collector.py weather_collector.py omo_collector.py rule_collector.py audit_replay.py audit_daemon.py runner.py
      - run: python -c "import websockets, cryptography, psycopg; print(websockets.__version__, cryptography.__version__, psycopg.__version__)"
      - run: docker build -t mercury-paper-collector .

  probe-backtest-results:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch deployed Mercury backtest aggregates
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://mercury-edge-web-production.up.railway.app/api/results'
          with urllib.request.urlopen(url, timeout=30) as r:
              data=json.load(r)
          print('LATEST_RUN', json.dumps(data.get('latestRun'), sort_keys=True))
          print('STATIONS')
          for row in sorted(data.get('stations', []), key=lambda x: (-(x.get('netProfit') or 0), -(x.get('averageLagSeconds') or 0))):
              print(json.dumps(row, sort_keys=True))
          print('SIGNALS')
          for row in sorted(data.get('signals', []), key=lambda x: (x.get('reactionLagSeconds') or -1), reverse=True):
              print(json.dumps(row, sort_keys=True))
          print('COVERAGE')
          for row in data.get('coverage', []):
              print(json.dumps(row, sort_keys=True))
          PY
