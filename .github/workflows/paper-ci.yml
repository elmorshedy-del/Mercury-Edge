name: Paper Trader CI

on:
  pull_request:
  push:
    branches:
      - paper-trader-v1
      - paper-rigour-v2

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run check

  collector-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper_collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: paper_collector/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile collector.py weather_collector.py omo_collector.py rule_collector.py paper_engine.py strategy_engines.py strategy_runtime.py unified_engine.py status_reporter.py audit_replay.py audit_daemon.py runner.py stations.py asos_evidence.py market_calendar.py test_strategy_engines.py test_asos_evidence.py test_market_calendar.py
      - run: python -m unittest -v test_strategy_engines.py test_asos_evidence.py test_market_calendar.py
      - run: python -c "import websockets, cryptography, psycopg; print(websockets.__version__, cryptography.__version__, psycopg.__version__)"
      - run: docker build -t mercury-paper-collector .
