name: Paper Trader CI

on:
  pull_request:
  push:
    branches:
      - paper-trader-v1

permissions:
  contents: read

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - run: npm run check

  collector-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paper_collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: paper_collector/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile collector.py weather_collector.py omo_collector.py rule_collector.py audit_replay.py audit_daemon.py runner.py
      - run: python -c "import websockets, cryptography, psycopg; print(websockets.__version__, cryptography.__version__, psycopg.__version__)"
      - run: docker build -t mercury-paper-collector .

  probe-backtest-results:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze executable stale entries
        run: |
          python - <<'PY'
          import json, statistics, urllib.request
          from collections import Counter,defaultdict
          from datetime import datetime
          from zoneinfo import ZoneInfo
          TZ={'KNYC':'America/New_York','KPHL':'America/New_York','KMDW':'America/Chicago','KDEN':'America/Denver','KMIA':'America/New_York','KLAX':'America/Los_Angeles','KAUS':'America/Chicago','KATL':'America/New_York','KBOS':'America/New_York','KDFW':'America/Chicago','KDCA':'America/New_York','KHOU':'America/Chicago','KLAS':'America/Los_Angeles','KMSP':'America/Chicago','KMSY':'America/Chicago','KOKC':'America/Chicago','KPHX':'America/Phoenix','KSAT':'America/Chicago'}
          with urllib.request.urlopen('https://mercury-edge-web-production.up.railway.app/api/results',timeout=30) as r:data=json.load(r)
          sig=data.get('signals',[]); by=defaultdict(list)
          for x in sig: by[x['station']].append(x)
          print('EXECUTABLE_ENTRY_DISTRIBUTION')
          for st,ss in sorted(by.items()):
            ex=[x for x in ss if x.get('executable')]
            prices=[x.get('entryCents') for x in ex if x.get('entryCents') is not None]
            lags=[x.get('reactionLagSeconds') for x in ex if x.get('reactionLagSeconds') is not None]
            hh=[]; mm=[]
            for x in ex:
              dt=datetime.fromisoformat(x['triggeredAt'].replace('Z','+00:00')).astimezone(ZoneInfo(TZ[st])); hh.append(dt.hour); mm.append(dt.minute)
            print(json.dumps({'station':st,'exec':len(ex),'entry_lt100':sum(p<100 for p in prices),'entry_le95':sum(p<=95 for p in prices),'entry_le90':sum(p<=90 for p in prices),'min_entry_c':min(prices) if prices else None,'exec_lag_median_s':statistics.median(lags) if lags else None,'exec_lag_max_s':max(lags) if lags else None,'modal_exec_hour':Counter(hh).most_common(3),'modal_exec_minute':Counter(mm).most_common(5)},sort_keys=True))
          print('ALL_EXECUTABLE_ENTRIES_BELOW_100C')
          for x in sorted([x for x in sig if x.get('executable') and x.get('entryCents') is not None and x['entryCents']<100],key=lambda x:x['entryCents']):
            dt=datetime.fromisoformat(x['triggeredAt'].replace('Z','+00:00')).astimezone(ZoneInfo(TZ[x['station']]))
            y=dict(x);y['local_trigger']=dt.isoformat();print(json.dumps(y,sort_keys=True))
          print('LOSSES_BY_STATION')
          for st,ss in sorted(by.items()):
            losses=[x for x in ss if x.get('outcome')=='loss']
            if losses: print(json.dumps({'station':st,'losses':len(losses),'total':len(ss),'dates':Counter(x['date'] for x in losses).most_common(10),'contracts':Counter(x['contract'] for x in losses).most_common(5)},sort_keys=True))
          print('PHX_LONG_LAGS')
          for x in sorted([x for x in by.get('KPHX',[]) if (x.get('reactionLagSeconds') or 0)>=120],key=lambda x:x['reactionLagSeconds'],reverse=True):
            y=dict(x); y['local_trigger']=datetime.fromisoformat(x['triggeredAt'].replace('Z','+00:00')).astimezone(ZoneInfo('America/Phoenix')).isoformat(); print(json.dumps(y,sort_keys=True))
          PY
